<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap">

    <title>Compleanno Celeste</title>
</head>

<body>
    <div>
        <div class="card logo">
            <div class="numero">
                18
            </div>
            <div class="nome">
                Celeste
            </div>
        </div>

        <div>
            <form action="">
                <input type="file" name="file" id="file" accept=".jpg,.jpeg,.raw,.heic,.heif,.png" multiple max="10"
                    required>
                <label for="file" id="label">+</label>

                <div id="progressContainer">
                    <div id="progressBar"></div>
                </div>
                <p id="status"></p>

                <div id="preview"></div>

                <div id="formButton">
                    <input type="reset" name="reset" id="reset" value="ANNULLA">
                    <input type="submit" name="submit" id="submit" value="CARICA">
                </div>
            </form>
        </div>

        <div id="photos">
        </div>
    </div>
    <div id="lightbox">
        <img id="lightboxImage" src="" alt="">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
